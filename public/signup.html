<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · StudyMate</title><link rel="stylesheet" href="/common.css"></head><body><main class="auth-wrap"><section class="auth-art"><a class="brand" href="/" style="color:white">StudyMate<span>.</span></a><h1>Build a routine that works for you.</h1><p>Your schedule and tasks stay saved to your account across sessions.</p></section><section class="auth-form-wrap"><div class="auth-box"><a class="brand" href="/">StudyMate<span>.</span></a><h1>Create your account</h1><p class="muted">Start planning your study week.</p><form id="auth-form" class="form"><div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required minlength="2"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><p class="error" id="error" role="alert"></p><button class="btn">Create account</button></form><p class="muted">Already registered? <a href="/login.html" style="color:var(--purple-dark);font-weight:700">Sign in</a></p></div></section></main><script src="/app.js"></script><script src="/auth.js"></script></body></html>
